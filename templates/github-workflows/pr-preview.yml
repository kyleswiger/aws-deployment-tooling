# Ephemeral per-PR frontend preview + full CI gate.
#
# Builds the branch UI against a shared, persistent dev backend and uploads it to
# a per-branch S3 prefix, so every PR gets its own URL
# (https://<safe-branch>.dev.<domain>) while sharing one backend. Also runs the
# lint/test/e2e gate before deploying.
#
# Placeholders to replace for your project:
#   <DEV_API_URL>        e.g. https://api.dev.example.com
#   <DEV_UI_BUCKET>      e.g. myapp-dev-ui
#   <PREVIEW_DOMAIN>     e.g. dev.example.com  (→ https://<branch>.dev.example.com)
#
# Repo config (Settings → Secrets and variables → Actions):
#   secret  AWS_GITHUB_ACTIONS_ROLE_ARN       from the github-oidc-role module
#   var     ENABLE_EPHEMERAL_PREVIEW_DEPLOY   "true" to actually deploy previews
#   var     PLAYWRIGHT_E2E                    "true" to run backend-dependent e2e

name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # Skip the whole workflow on docs-only / config-only PRs.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'ui/**'
              - 'src/**'
              - 'backend/**'
              - 'terraform/**'
              - 'infra/**'
              - 'scripts/**'
              - '.github/workflows/**'

  test:
    name: Test and Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install UI dependencies
        working-directory: ./ui
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint UI
        working-directory: ./ui
        run: npm run lint

      - name: Build UI (dev backend)
        working-directory: ./ui
        env:
          VITE_API_BASE_URL: <DEV_API_URL>
        run: npm run build

      # Hand the built bundle to the preview job so it isn't rebuilt.
      - name: Upload UI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1
          if-no-files-found: error

      # --- Backend unit tests (adapt to your stack) ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Run backend tests
        run: |
          if [ -d "tests" ]; then
            pip install pytest
            pytest -q tests
          else
            echo "No python tests found, skipping"
          fi

      # --- Playwright e2e against the shared dev backend (optional) ---
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-

      - name: Install Playwright
        working-directory: ./ui
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Start UI preview server
        working-directory: ./ui
        run: npx vite preview --port 5173 &

      - name: Wait for preview server
        run: timeout 30 bash -c 'until curl -sf http://localhost:5173 >/dev/null; do sleep 1; done'

      - name: E2E — smoke tests
        working-directory: ./ui
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npm run test:e2e -- e2e/smoke.spec.ts

      # A shared-dev-backend outage must NOT fail the unit/smoke gate — it only
      # gates the backend-dependent e2e below.
      - name: Dev API health check
        id: devapi
        if: vars.PLAYWRIGHT_E2E == 'true'
        run: |
          for i in 1 2 3; do
            if curl -sf --max-time 15 <DEV_API_URL>/ -o /dev/null; then
              echo "reachable=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 5
          done
          echo "::warning::dev API unreachable — skipping backend e2e for this run"
          echo "reachable=false" >> "$GITHUB_OUTPUT"

      - name: E2E — backend-dependent
        if: vars.PLAYWRIGHT_E2E == 'true' && steps.devapi.outputs.reachable == 'true'
        working-directory: ./ui
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npm run test:e2e -- e2e/integration.spec.ts

  preview:
    name: Deploy Ephemeral Preview
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
      PREVIEW_DEPLOY_ENABLED: ${{ vars.ENABLE_EPHEMERAL_PREVIEW_DEPLOY }}
    steps:
      - uses: actions/checkout@v4

      - name: Download UI build artifact
        if: env.PREVIEW_DEPLOY_ENABLED == 'true' && env.AWS_ROLE_ARN != ''
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Configure AWS credentials
        id: aws-creds
        if: env.PREVIEW_DEPLOY_ENABLED == 'true' && env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1
        continue-on-error: true

      - name: Skip preview (not enabled or no role)
        if: env.PREVIEW_DEPLOY_ENABLED != 'true' || env.AWS_ROLE_ARN == ''
        run: echo "Preview deploy disabled or role not configured; skipping."

      - name: Sync UI to per-branch dev prefix
        id: sync-ui
        if: steps.aws-creds.outcome == 'success'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | tr -cd 'a-zA-Z0-9-' | tr '[:upper:]' '[:lower:]' | cut -c 1-63 | sed 's/-$//')
          aws s3 sync ./ui/dist "s3://<DEV_UI_BUCKET>/$SAFE_BRANCH/" --delete
          echo "PREVIEW_URL=https://$SAFE_BRANCH.<PREVIEW_DOMAIN>" >> $GITHUB_ENV

      - name: Comment PR
        uses: mshick/add-pr-comment@v2
        if: steps.sync-ui.outcome == 'success'
        with:
          message: |
            🚀 **Preview environment ready:** ${{ env.PREVIEW_URL }}

            *Connects to the shared dev backend (`<DEV_API_URL>`).*
