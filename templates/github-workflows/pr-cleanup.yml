# Deletes a PR's ephemeral preview assets when the PR is closed or merged, so the
# shared dev UI bucket doesn't accumulate stale per-branch prefixes.
#
# Placeholders:
#   <DEV_UI_BUCKET>   e.g. myapp-dev-ui  (must match pr-preview.yml)

name: PR Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
    steps:
      - name: Configure AWS credentials
        id: aws-creds
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1
        continue-on-error: true

      - name: Delete preview prefix
        if: steps.aws-creds.outcome == 'success'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | tr -cd 'a-zA-Z0-9-' | tr '[:upper:]' '[:lower:]' | cut -c 1-63 | sed 's/-$//')
          echo "Removing s3://<DEV_UI_BUCKET>/$SAFE_BRANCH/"
          aws s3 rm "s3://<DEV_UI_BUCKET>/$SAFE_BRANCH/" --recursive
