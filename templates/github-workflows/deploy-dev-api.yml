# Keeps the shared dev backend container Lambda(s) running real code. Runs
# manually (workflow_dispatch) after the initial infra apply, and automatically
# whenever backend code lands on main. Builds the image via GitHub Actions and
# rolls the function forward with update-function-code — the same contract the
# lambda-container Terraform module expects (it ignores image_uri drift).
#
# Placeholders:
#   <NAME_PREFIX>   e.g. myapp-dev   (Terraform name_prefix = "<project>-<env>")
#   <API_REPO>      ECR repo suffix, e.g. myapp-dev-api-repo
#
# Repo secret: AWS_GITHUB_ACTIONS_ROLE_ARN (from the github-oidc-role module).

name: Deploy Dev Lambda

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: false
        default: 'main'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'backend/**'
      - '.github/workflows/deploy-dev-api.yml'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      NAME_PREFIX: <NAME_PREFIX>
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Resolve ECR registry and names
        id: names
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          echo "ecr_registry=${ECR_REGISTRY}"                >> "$GITHUB_OUTPUT"
          echo "api_repo=${ECR_REGISTRY}/<API_REPO>"         >> "$GITHUB_OUTPUT"
          echo "api_lambda=${NAME_PREFIX}-api"               >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
            | docker login --username AWS --password-stdin "${{ steps.names.outputs.ecr_registry }}"

      - name: Build and push API image
        run: |
          docker build \
            -t "${{ steps.names.outputs.api_repo }}:${{ github.sha }}" \
            -t "${{ steps.names.outputs.api_repo }}:latest" \
            -f src/api/Dockerfile .
          docker push "${{ steps.names.outputs.api_repo }}:${{ github.sha }}"
          docker push "${{ steps.names.outputs.api_repo }}:latest"

      - name: Update API Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ steps.names.outputs.api_lambda }}" \
            --image-uri "${{ steps.names.outputs.api_repo }}:${{ github.sha }}" \
            --region "$AWS_DEFAULT_REGION"
          aws lambda wait function-updated \
            --function-name "${{ steps.names.outputs.api_lambda }}" \
            --region "$AWS_DEFAULT_REGION"
          echo "API Lambda updated to ${{ github.sha }}"
